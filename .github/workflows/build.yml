
name: Build Birds Client portable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Birds Client
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Restore app source files
        shell: pwsh
        run: |
          $archive = "Birds-Client-Portable-EXE-Source.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "birds-client-source"
          Expand-Archive -LiteralPath $archive -DestinationPath $extractPath -Force
          $sourceRoot = Join-Path $extractPath "Birds-Client"
          if (!(Test-Path "$sourceRoot/src/index.html")) {
            throw "Source files missing from archive"
          }
          Copy-Item "$sourceRoot/src" $env:GITHUB_WORKSPACE -Recurse -Force

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify source
        shell: pwsh
        run: |
          if (!(Test-Path "src/index.html")) { throw "index.html missing" }
          if (!(Test-Path "src/app.js")) { throw "app.js missing" }
          if (!(Test-Path "src/style.css")) { throw "style.css missing" }

      - name: Build EXE
        run: npm run dist -- --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Birds-Client-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
