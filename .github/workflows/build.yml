
name: EZFROST Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EZFROST Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore EZFROST source
        shell: pwsh
        run: |
          $archive = "Birds-Client-Portable-EXE-Source.zip"

          if (!(Test-Path $archive)) {
            throw "Source ZIP not found in repository root."
          }

          $extract = Join-Path $env:RUNNER_TEMP "ezfrost-source"

          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $sourceRoot = $extract

          if (Test-Path (Join-Path $extract "Birds-Client/src/index.html")) {
            $sourceRoot = Join-Path $extract "Birds-Client"
          }

          $requiredSource = @(
            "src/index.html",
            "src/app.js",
            "src/style.css"
          )

          foreach ($file in $requiredSource) {
            if (!(Test-Path (Join-Path $sourceRoot $file))) {
              throw "Missing source file in ZIP: $file"
            }
          }

          if (Test-Path "src") {
            Remove-Item "src" -Recurse -Force
          }

          Copy-Item (Join-Path $sourceRoot "src") "." -Recurse -Force

          Write-Host "EZFROST source restored successfully."

      - name: Verify project files
        shell: pwsh
        run: |
          $files = @(
            "package.json",
            "main.js",
            "preload.js",
            "src/index.html",
            "src/app.js",
            "src/style.css"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

          Write-Host "All required files are present."

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist -- --publish never

          if ($LASTEXITCODE -ne 0) {
            throw "EZFROST build failed."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "Dist folder was not created."
          }

          $installers = Get-ChildItem "dist" -Filter "*.exe" -File

          if ($installers.Count -eq 0) {
            throw "No EXE installer was generated."
          }

          $installers | Select-Object Name, Length

      - name: Upload EZFROST Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EZFROST-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload additional build files
        uses: actions/upload-artifact@v4
        with:
          name: EZFROST-Build-Files
          path: |
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
          retention-days: 14
