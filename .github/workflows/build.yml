
name: EZFROST Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EZFROST
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find source ZIP
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE

          $preferred = Join-Path $workspace "Birds-Client-Portable-EXE-Source (2).zip"

          if (Test-Path -LiteralPath $preferred) {
            $archive = $preferred
          } else {
            $archives = @(Get-ChildItem -LiteralPath $workspace -File -Filter "Birds-Client-Portable-EXE-Source*.zip")

            if ($archives.Count -ne 1) {
              Write-Host "ZIP files found:"
              Get-ChildItem $workspace -Filter "*.zip" | ForEach-Object { Write-Host $_.Name }
              throw "Could not identify exactly one source ZIP."
            }

            $archive = $archives[0].FullName
          }

          Write-Host "Using archive: $archive"

          $extract = Join-Path $env:RUNNER_TEMP "ezfrost-source"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $indexFile = Get-ChildItem -LiteralPath $extract -Filter "index.html" -File -Recurse |
            Where-Object { $_.Directory.Name -eq "src" } |
            Select-Object -First 1

          if (!$indexFile) {
            throw "Could not find src/index.html inside the ZIP."
          }

          $sourceRoot = Split-Path (Split-Path $indexFile.FullName -Parent) -Parent

          $required = @(
            "src/index.html",
            "src/app.js",
            "src/style.css",
            "src/icon.png"
          )

          foreach ($file in $required) {
            if (!(Test-Path (Join-Path $sourceRoot $file))) {
              throw "Missing source file: $file"
            }
          }

          $destination = Join-Path $workspace "src"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item (Join-Path $sourceRoot "src") -Destination $workspace -Recurse -Force

          Write-Host "EZFROST source restored successfully."

      - name: Verify project
        shell: pwsh
        run: |
          $required = @(
            "package.json",
            "main.js",
            "preload.js",
            "src/index.html",
            "src/app.js",
            "src/style.css",
            "src/icon.png"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing project file: $file"
            }
          }

          Write-Host "Project verification successful."

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }

      - name: Build EZFROST
        shell: pwsh
        run: |
          npm run dist -- --publish never

          if ($LASTEXITCODE -ne 0) {
            throw "EZFROST build failed."
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File)

          if ($installers.Count -eq 0) {
            throw "No EXE installer was generated."
          }

          $installers | Select-Object Name, Length

      - name: Upload EZFROST installer
        uses: actions/upload-artifact@v4
        with:
          name: EZFROST-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: EZFROST-Build-Files
          path: |
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
          retention-days: 14
