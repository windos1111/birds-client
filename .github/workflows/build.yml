
name: Build EZFROST Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EZFROST
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Restore app source files
        shell: pwsh
        run: |
          $archive = "Birds-Client-Portable-EXE-Source.zip"

          if (!(Test-Path $archive)) {
            throw "Source ZIP file was not found"
          }

          $extractPath = Join-Path $env:RUNNER_TEMP "ezfrost-source"

          Expand-Archive -LiteralPath $archive -DestinationPath $extractPath -Force

          $possibleFolders = @(
            (Join-Path $extractPath "Birds-Client"),
            $extractPath
          )

          $sourceRoot = $null

          foreach ($folder in $possibleFolders) {
            if (Test-Path (Join-Path $folder "src/index.html")) {
              $sourceRoot = $folder
              break
            }
          }

          if (!$sourceRoot) {
            throw "Could not find src/index.html inside the ZIP"
          }

          $source = Join-Path $sourceRoot "src"
          $destination = Join-Path $env:GITHUB_WORKSPACE "src"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item $source -Destination $destination -Recurse -Force

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify source files
        shell: pwsh
        run: |
          $files = @(
            "src/index.html",
            "src/app.js",
            "src/style.css"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing file: $file"
            }
          }

          Write-Host "EZFROST source files restored successfully!"

      - name: Build Windows EXE
        run: npm run dist -- --publish never

      - name: Upload EZFROST EXE
        uses: actions/upload-artifact@v4
        with:
          name: EZFROST-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
